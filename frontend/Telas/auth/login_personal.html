<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitManager - Login</title>

</head>

<body>

    <main class="login-container">

        <section class="login">

            <h1 class="logo">FitManager</h1>

            <h2>Entrar</h2>

            <p>
                Acesse sua conta para gerenciar seus alunos e treinos.
            </p>


            <!-- FORMULÁRIO DE LOGIN -->

            <form class="form-login">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >


                <a href="recuperacao_senha.html">
                    Esqueci minha senha
                </a>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p>
                Ainda não possui uma conta?

                <a href="cadastro_personal.html">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

</body>

</html>
