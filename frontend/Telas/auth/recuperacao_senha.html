<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
</head>

<body>
    <main class="recuperar-container">

        <section class="recuperar-senha">

            <h1 class="logo">FitManager</h1>

            <h2>Recuperar senha</h2>

            <p>
                Informe o e-mail cadastrado para receber as instruções
                de recuperação da sua senha.
            </p>

            <form class="form-recuperar">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Enviar link de recuperação
                </button>

            </form>

            <a href="login_personal.html">
                Voltar para o login
            </a>

        </section>

    </main>
</body>
</html>
