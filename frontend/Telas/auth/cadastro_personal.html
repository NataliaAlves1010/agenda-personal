<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitManager - Cadastro</title>

</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro">

            <h1 class="logo">FitManager</h1>

            <h2>Crie sua conta</h2>

            <p>
                Cadastre-se para começar a gerenciar seus alunos e treinos.
            </p>


            <!-- FORMULÁRIO DE CADASTRO -->

            <form class="form-cadastro">

                <fieldset>

                    <legend>Dados pessoais</legend>

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >


                    <label for="cref">
                        CREF
                    </label>

                    <input
                        type="text"
                        id="cref"
                        name="cref"
                        placeholder="Digite seu CREF"
                        required
                    >


                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >


                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </fieldset>


                <fieldset>

                    <legend>Segurança</legend>

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >


                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </fieldset>


                <p class="tipo-usuario">
                    Cadastro como:
                    <strong>Personal Trainer</strong>
                </p>


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <p>
                Já possui uma conta?
                <a href="login_personal.html">Entrar</a>
            </p>

        </section>

    </main>

</body>

</html>
