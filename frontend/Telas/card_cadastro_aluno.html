<!-- Modal de Cadastro de Aluno -->
<div id="modal-aluno" class="modal">

  <div class="modal-conteudo">
    
    <div class="modal-header">

      <h2 id="titulo-modal">Cadastrar Novo Aluno</h2>
      <button id="btn-fechar-modal" class="btn-fechar" type="button" aria-label="Fechar janela">&times;</button>

    </div>

    <form id="form-cadastrar-aluno" class="form-modal">
      
      <!-- Upload de Foto Otimizado com Drag & Drop -->
      <div class="campo-grupo area-upload-foto">

        <label for="foto-aluno">Foto do Aluno</label>

        <div class="drop-zone" id="drop-zone">

          <img id="preview-foto" src="" alt="Foto do aluno" class="img-preview">
          
          <div class="drop-zone-placeholder" id="placeholder-foto">

            <p>Clique aqui ou arraste a foto do aluno</p>

          </div>

          <input type="file" id="foto-aluno" accept="image/*" class="input-file-oculto">

        </div>

      </div>

      <!-- Dados Pessoais -->
      <div class="campo-grupo">

        <label for="nome-aluno">Nome Completo *</label>
        <input type="text" id="nome-aluno" name="nome" required placeholder="Ex: João Silva dos Santos">

      </div>

      <div class="campo-duplo">

        <div class="campo-grupo">

          <label for="idade-aluno">Idade *</label>
          <input type="number" id="idade-aluno" name="idade" min="1" max="120" required>

        </div>

        <div class="campo-grupo">

          <label for="telefone-aluno">Telefone / WhatsApp *</label>
          <input type="tel" id="telefone-aluno" name="telefone" required placeholder="(86) 99999-9999" inputmode="tel">

        </div>

      </div>

      <div class="campo-grupo">

        <label for="email-aluno">E-mail *</label>
        <input type="email" id="email-aluno" name="email" required placeholder="aluno@email.com">

      </div>

      <!-- Informações Médicas -->
      <div class="campo-grupo">

        <label for="restricoes-aluno">Restrições Médicas / Lesões</label>
        <textarea id="restricoes-aluno" name="restricoes" placeholder="Ex: Hérnia de disco L4-L5, hipertensão, dores no joelho direito..."></textarea>

      </div>

      <!-- Ações do Modal -->
      <div class="modal-acoes">

        <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
        <button type="submit" id="btn-salvar" class="btn-primario">Salvar Aluno</button>

      </div>

    </form>

  </div>

</div>
