<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag obrigatória para renderização responsiva em celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitManager - Meu Perfil</title>
</head>

<body>

    <!-- CABEÇALHO GLOBAL (Navegação principal) -->
    <header class="aba-navegacao">

        <h1 class="logo">FitManager</h1>

        <nav class="menu" id="menu">

            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="criacao_treino.html">Criação de Treino</a></li>
                <li><a href="meu_perfil.html">Meu Perfil</a></li>
            </ul>

        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL EXCLUSIVO DA PÁGINA -->
    <main class="perfil-container">

        <h2 class="titulo-pagina">Meu Perfil</h2>

        <!-- Formulário principal contendo as seções de edição e visualização do perfil -->
        <form class="form-perfil">

            <!-- 
                SEÇÃO 1: CARTÃO DO PERSONAL (Foto, Dados Principais e Redes Sociais)
                No mobile, fica empilhado em 1 coluna; no desktop, pode usar 2 colunas.
            -->
            <section class="informacoes-personal">
                
                <!-- Card de Identificação -->
                <div class="card-identificacao">

                    <img 
                        src="../fotos/Personal.webp" 
                        alt="Foto de perfil do Personal Trainer Marcos Torres" 
                        class="foto-personal"
                    >

                    <div class="detalhes-personal">
                        <h3 class="nome-personal">Marcos Torres</h3>
                        <span class="profissao">Personal Trainer</span>
                        <span class="cref">CREF 012345-G/SP</span>
                        <span class="informacoes-conta">6 Alunos • 42 Treinos • 8 Anos Exp.</span>
                    </div>

                </div>

                <!-- Lista de Redes Sociais -->
                <div class="redes-sociais-container">

                    <h3 class="subtitulo-secao">Redes Sociais</h3>

                    <div class="lista-redes">
                        <span class="rede-social-tag">@instagram</span>
                        <span class="rede-social-tag">Youtube</span>
                        <span class="rede-social-tag">@Twitter</span>
                        <span class="rede-social-tag">Site</span>
                    </div>

                </div>

            </section> <!-- /.informacoes-personal -->


            <!-- 
                SEÇÃO 2: DETALHES BIOGRÁFICOS E QUALIFICAÇÕES
            -->
            <section class="detalhes-perfil">
                
                <!-- Campo: Sobre Mim -->
                <div class="campo-form">

                    <label for="sobre-mim" class="rotulo-campo">Sobre mim</label>
                    <textarea 
                        name="sobre-mim" 
                        id="sobre-mim" 
                        class="input-textarea"
                        placeholder="Escreva um breve resumo da sua trajetória profissional, metodologia de treino e foco de atendimento..."
                    ></textarea>

                </div>

                <!-- Lista de Qualificações -->
                <div class="qualificacoes-container">

                    <h3 class="subtitulo-secao">Qualificações</h3>
                    
                    <div class="item-qualificacao">
                        <span class="curso">Bacharelado em Educação Física</span>
                        <span class="instituicao">UFPI</span>
                        <span class="ano-conclusao">2026</span>
                    </div>

                </div>

            </section> <!-- /.detalhes-perfil -->


            <!-- BOTÃO DE AÇÃO PRINCIPAL -->
            <div class="acoes-form">
                <button type="submit" class="btn-salvar">Salvar Alterações</button>
            </div>

        </form>

    </main>

</body>
</html>
