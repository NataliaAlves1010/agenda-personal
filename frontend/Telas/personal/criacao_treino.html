<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://kit.fontawesome.com/d5c54d2ec4.js" crossorigin="anonymous" defer></script>

    <link rel="stylesheet" href="../../css/personal/criacao_treino.css">

    <title>FitManager - Criação de Treino</title>

</head>

<body>

    <!-- CABEÇALHO -->

    <header class="aba-navegacao">

        <h1 class="logo">FitManager</h1>

        <nav class="menu" id="menu">

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="criacao_treino.html">Criação de Treino</a></li>
                <li><a href="meu_perfil.html">Meu Perfil</a></li>

            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="criacao-treino-container">

        <h2 class="titulo-pagina">Criação de Treino</h2>


        <!-- ALUNO SELECIONADO -->

        <section class="card-aluno-selecionado">

            <h3 class="secao-titulo">Aluno Selecionado</h3>

            <div class="aluno-info-basica">

                <div class="avatar-aluno">
                    <img src="../fotos/aluno1.jpg" alt="Foto do aluno" class="foto-aluno">
                    <span class="avatar-iniciais" aria-hidden="true" hidden></span>
                </div>

                <div class="aluno-detalhes">

                    <p class="nome-aluno">João</p>
                    <p class="matricula">#FM-1024</p>

                </div>
                <button type="button" class="botao-selecionar-aluno" id="botao-selecionar-aluno" aria-label="Selecionar aluno" aria-expanded="false" aria-controls="lista-alunos-seletor" hidden>
                    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                </button>

            </div>
            <div class="lista-alunos-seletor" id="lista-alunos-seletor" role="listbox" aria-label="Escolha o aluno" hidden></div>

        </section>


        <!-- CONFIGURAÇÃO DA IA -->

        <form class="form-criacao-treino">

            <details class="config-ia-container" open>

                <summary class="config-ia-titulo">
                    Configurar IA
                </summary>

                <div class="config-ia-conteudo">

                    <div class="campo-form">

                        <label for="prompt" class="rotulo-campo">
                            Diretrizes da IA
                        </label>

                        <textarea 
                            name="prompt" 
                            id="prompt" 
                            class="input-textarea"
                            placeholder="Descreva focos, restrições ou ajustes..."
                        ></textarea>

                    </div>

                    <div class="campo-form">

                        <label for="objetivo" class="rotulo-campo">
                            Objetivo
                        </label>

                        <select name="objetivo-treino" id="objetivo" class="input-select">

                            <option value="hipertrofia">Hipertrofia</option>
                            <option value="emagrecimento">Emagrecimento</option>

                        </select>

                    </div>

                    <div class="campo-form">

                        <label for="foco" class="rotulo-campo">
                            Foco
                        </label>

                        <select name="foco" id="foco" class="input-select">

                            <option value="peito_triceps">Peito e Tríceps</option>
                            <option value="costas_biceps">Costas e Bíceps</option>
                            <option value="perna">Perna</option>
                            <option value="fullbody">FullBody</option>

                        </select>

                    </div>

                    <div class="campo-form">

                        <label for="nivel" class="rotulo-campo">
                            Nível
                        </label>

                        <select name="nivel" id="nivel" class="input-select">

                            <option value="iniciante">Iniciante</option>
                            <option value="intermediario">Intermediário</option>
                            <option value="avancado">Avançado</option>

                        </select>

                    </div>

                    <button type="button" class="btn-gerar-rascunho">
                        Gerar Rascunho com IA
                    </button>

                </div>

            </details>

        </form>


        <!-- ESTRUTURA DO TREINO -->

        <form class="form-treino" id="form-treino">

            <section class="resumo-treino">

                <div class="datas-treino">
                    <div class="campo-data-treino">
                        <label for="data-inicio-treino">Data de in&#xED;cio</label>
                        <input type="date" id="data-inicio-treino" name="data-inicio-treino" required>
                    </div>
                    <div class="campo-data-treino">
                        <label for="data-fim-treino">Data de t&#xE9;rmino</label>
                        <input type="date" id="data-fim-treino" name="data-fim-treino" required>
                    </div>
                </div>

                <div class="dados-exercicio">

                    <label for="nome-treino">Nome do treino</label>

                    <input 
                        type="text" 
                        name="nome-treino" 
                        id="nome-treino" 
                        placeholder="TREINO A"
                    >

                </div>


                <!-- BLOCO -->

                <section class="bloco-treino">

                    <header class="cabecalho-bloco">

                        <h3>Bloco 1</h3>

                        <button type="button" class="botao-adicionar-exercicio">
                            + Exercício
                        </button>

                    </header>


                    <!-- EXERCÍCIOS DO BLOCO -->

                    <ol class="lista-exercicios">

                        <!-- EXERCÍCIO -->

                        <li class="exercicio">

                            <div class="dados-exercicio">

                                <label for="nome-exercicio-1">
                                    Nome do exercício
                                </label>

                                <input
                                    type="text"
                                    id="nome-exercicio-1"
                                    name="nome-exercicio-1"
                                    placeholder="Ex.: Crucifixo"
                                >

                            </div>


                            <!-- CONFIGURAÇÃO DO EXERCÍCIO -->

                            <fieldset>

                                <legend>Configuração</legend>

                                <label for="series-exercicio-1">
                                    Séries
                                </label>

                                <input
                                    type="number"
                                    id="series-exercicio-1"
                                    name="series-exercicio-1"
                                    placeholder="4"
                                >


                                <label for="repeticoes-exercicio-1">
                                    Repetições
                                </label>

                                <input
                                    type="number"
                                    id="repeticoes-exercicio-1"
                                    name="repeticoes-exercicio-1"
                                    placeholder="12"
                                >

                            </fieldset>


                            <!-- OBSERVAÇÕES -->

                            <label for="observacoes-exercicio-1">
                                Observações
                            </label>

                            <textarea
                                id="observacoes-exercicio-1"
                                name="observacoes-exercicio-1"
                                placeholder="Observações sobre o exercício..."
                            ></textarea>


                            <!-- AÇÕES DO EXERCÍCIO -->

                            <div class="acoes-exercicio">

                                <button type="button" class="botao-editar">
                                    <i class="fa-solid fa-pen"></i>
                                    Editar
                                </button>

                                <button type="button" class="botao-excluir">
                                    <i class="fa-solid fa-trash"></i>
                                    Excluir
                                </button>

                            </div>

                        </li>


                        <!-- EXERCÍCIO 2 -->

                        <li class="exercicio">

                            <div class="dados-exercicio">

                                <label for="nome-exercicio-2">
                                    Nome do exercício
                                </label>

                                <input
                                    type="text"
                                    id="nome-exercicio-2"
                                    name="nome-exercicio-2"
                                    placeholder="Ex.: Supino reto"
                                >

                            </div>

                            <fieldset>

                                <legend>Configuração</legend>

                                <label for="series-exercicio-2">
                                    Séries
                                </label>

                                <input
                                    type="number"
                                    id="series-exercicio-2"
                                    name="series-exercicio-2"
                                    placeholder="4"
                                >

                                <label for="repeticoes-exercicio-2">
                                    Repetições
                                </label>

                                <input
                                    type="number"
                                    id="repeticoes-exercicio-2"
                                    name="repeticoes-exercicio-2"
                                    placeholder="10"
                                >

                            </fieldset>

                            <label for="observacoes-exercicio-2">
                                Observações
                            </label>

                            <textarea
                                id="observacoes-exercicio-2"
                                name="observacoes-exercicio-2"
                                placeholder="Observações sobre o exercício..."
                            ></textarea>

                            <div class="acoes-exercicio">

                                <button type="button" class="botao-editar">
                                    <i class="fa-solid fa-pen"></i>
                                    Editar
                                </button>

                                <button type="button" class="botao-excluir">
                                    <i class="fa-solid fa-trash"></i>
                                    Excluir
                                </button>

                            </div>

                        </li>

                    </ol>

                </section>


                <!-- BLOCO -->

                <section class="bloco-treino">

                    <header class="cabecalho-bloco">

                        <h3>Bloco 2</h3>

                        <button type="button" class="botao-adicionar-exercicio">
                            + Exercício
                        </button>

                    </header>

                    <ol class="lista-exercicios">

                        <li class="exercicio">

                            <div class="dados-exercicio">

                                <label for="nome-exercicio-3">
                                    Nome do exercício
                                </label>

                                <input
                                    type="text"
                                    id="nome-exercicio-3"
                                    name="nome-exercicio-3"
                                    placeholder="Ex.: Tríceps na polia"
                                >

                            </div>

                            <fieldset>

                                <legend>Configuração</legend>

                                <label for="series-exercicio-3">
                                    Séries
                                </label>

                                <input
                                    type="number"
                                    id="series-exercicio-3"
                                    name="series-exercicio-3"
                                    placeholder="3"
                                >

                                <label for="repeticoes-exercicio-3">
                                    Repetições
                                </label>

                                <input
                                    type="number"
                                    id="repeticoes-exercicio-3"
                                    name="repeticoes-exercicio-3"
                                    placeholder="12"
                                >

                            </fieldset>

                            <label for="observacoes-exercicio-3">
                                Observações
                            </label>

                            <textarea
                                id="observacoes-exercicio-3"
                                name="observacoes-exercicio-3"
                                placeholder="Observações sobre o exercício..."
                            ></textarea>

                            <div class="acoes-exercicio">

                                <button type="button" class="botao-editar">
                                    <i class="fa-solid fa-pen"></i>
                                    Editar
                                </button>

                                <button type="button" class="botao-excluir">
                                    <i class="fa-solid fa-trash"></i>
                                    Excluir
                                </button>

                            </div>

                        </li>

                    </ol>

                </section>


                <!-- ADICIONAR NOVO BLOCO -->

                <button type="button" class="botao-adicionar-bloco">
                    + Adicionar Novo Bloco
                </button>


                <!-- AÇÕES DO TREINO -->

                <div class="acoes-treino">

                    <button type="button" class="botao-editar">
                        Editar Estrutura
                    </button>

                    <button type="submit" class="botao-salvar-treino">
                        SALVAR E ENVIAR TREINO
                    </button>

                </div>

            </section>
        </form>

    </main>


    <script>
      (() => {
        const card = document.querySelector('.card-aluno-selecionado');
        const trigger = document.getElementById('botao-selecionar-aluno');
        const menu = document.getElementById('lista-alunos-seletor');
        const nameNode = card?.querySelector('.nome-aluno');
        const idNode = card?.querySelector('.matricula');
        const image = card?.querySelector('.foto-aluno');
        const initials = card?.querySelector('.avatar-iniciais');
        if (!card || !trigger || !menu || !nameNode || !idNode || !image || !initials) return;

        const activeStudents = [];
        const currentStudent = {
          name: nameNode.textContent.trim(),
          id: idNode.textContent.trim(),
          photo: image.getAttribute('src') || ''
        };

        const getInitials = (name) => name.trim().split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toUpperCase();

        const setAvatar = (student) => {
          initials.textContent = getInitials(student.name);
          initials.hidden = true;
          image.hidden = false;
          image.onerror = () => {
            image.hidden = true;
            initials.hidden = false;
          };
          image.src = student.photo || currentStudent.photo;
          if (image.complete && image.naturalWidth === 0) {
            image.hidden = true;
            initials.hidden = false;
          }
        };

        const setStudent = (student) => {
          nameNode.textContent = student.name;
          idNode.textContent = student.id;
          setAvatar(student);
          menu.querySelectorAll('[role="option"]').forEach((option) => {
            option.setAttribute('aria-selected', String(option.dataset.studentId === student.id));
          });
        };

        const closeMenu = () => {
          menu.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
        };

        const renderOptions = () => {
          menu.replaceChildren();
          activeStudents.forEach((student) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'opcao-aluno-seletor';
            option.setAttribute('role', 'option');
            option.dataset.studentId = student.id;
            option.setAttribute('aria-selected', String(student.id === idNode.textContent.trim()));
            option.textContent = `${student.name}  ${student.id}`;
            option.addEventListener('click', () => {
              setStudent(student);
              closeMenu();
              trigger.focus();
            });
            menu.append(option);
          });
          trigger.hidden = activeStudents.length < 2;
        };

        activeStudents.push(currentStudent);

        fetch(new URL('alunos.html', window.location.href))
          .then((response) => response.ok ? response.text() : '')
          .then((markup) => {
            if (!markup) return;
            const documentAlunos = new DOMParser().parseFromString(markup, 'text/html');
            const seen = new Set();
            documentAlunos.querySelectorAll('.card-aluno').forEach((studentCard) => {
              if (studentCard.querySelector('.status-aluno') && !studentCard.querySelector('.status-aluno').classList.contains('status-ativo')) return;
              const name = studentCard.querySelector('.nome-aluno')?.textContent.trim();
              const id = studentCard.querySelector('.matricula-aluno')?.textContent.trim();
              if (!name || !id || seen.has(id)) return;
              seen.add(id);
              const existing = activeStudents.findIndex((student) => student.id === id);
              const student = {
                name,
                id,
                photo: studentCard.querySelector('.foto-aluno')?.getAttribute('src') || currentStudent.photo
              };
              if (existing >= 0) activeStudents[existing] = student;
              else activeStudents.push(student);
            });
            const selected = activeStudents.find((student) => student.id === currentStudent.id) || activeStudents[0];
            if (selected) setStudent(selected);
            renderOptions();
          })
          .catch(() => renderOptions());

        trigger.addEventListener('click', () => {
          const opening = menu.hidden;
          menu.hidden = !opening;
          trigger.setAttribute('aria-expanded', String(opening));
        });

        document.addEventListener('click', (event) => {
          if (!card.contains(event.target)) closeMenu();
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeMenu();
        });

        setAvatar(currentStudent);
      })();
    </script>

    <script>
      (() => {
        const start = document.getElementById('data-inicio-treino');
        const end = document.getElementById('data-fim-treino');
        if (!start || !end) return;

        const syncDateLimits = () => {
          if (start.value && end.value && end.value < start.value) end.value = '';
          end.min = start.value;
          start.max = end.value;
        };

        start.addEventListener('change', syncDateLimits);
        end.addEventListener('change', syncDateLimits);
        syncDateLimits();
      })();
    </script>
</body>

</html>
