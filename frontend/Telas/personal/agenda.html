<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitManager - Agenda</title>

    <!-- FULLCALENDAR -->

    <script 
        src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js" 
        defer>
    </script>

    <script 
        src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/global.js" 
        defer>
    </script>

    <!-- SCRIPT DA AGENDA -->

    <script src="../../js/agenda.js" defer></script>

    <!-- FULLCALENDAR STYLESHEETS -->

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css" 
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/theme.css" 
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/palettes/purple.css" 
        rel="stylesheet"
    >

</head>


<body>

    <!-- CABEÇALHO -->

    <header class="aba-navegacao">

        <h1 class="logo">FitManager</h1>

        <nav class="menu" id="menu">

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="criacao_treino.html">Criação de Treino</a></li>
                <li><a href="meu_perfil.html">Meu Perfil</a></li>

            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="agenda-container">


        <!-- TÍTULO DA PÁGINA E BOTÃO -->

        <div class="cabecalho-pagina">

            <h2 class="titulo-pagina">
                Agenda de Treinos
            </h2>

            <button 
                type="button" 
                class="btn-agendar-compromisso" 
                id="btn-abrir-modal"
            >
                Agendar Compromisso
            </button>

        </div>


        <!-- CALENDÁRIO -->

        <div 
            id="calendar" 
            class="calendario-box">
        </div>


        <!-- PROGRAMAÇÃO DO DIA -->

        <section class="programacao-dia">

            <div class="cabecalho-secao">

                <h3 class="titulo-secao">
                    Programação do dia
                </h3>

                <time 
                    class="data-selecionada" 
                    datetime="2026-09-16"
                >
                    16 de Setembro, 2026
                </time>

            </div>


            <!-- LISTA DE COMPROMISSOS -->

            <div class="lista-compromissos">


                <!-- COMPROMISSO -->

                <article class="card-compromisso">

                    <div class="detalhes-compromisso">

                        <time 
                            class="horario" 
                            datetime="07:00"
                        >
                            07:00
                        </time>

                        <span class="nome-aluno">
                            João Silva
                        </span>

                        <span class="tipo-treino">
                            Avaliação física
                        </span>

                    </div>


                    <!-- INFORMAÇÕES ADICIONAIS -->

                    <div class="informacoes-compromisso">

                        <span>
                            60 minutos
                        </span>

                        <span>
                            Sala de avaliação
                        </span>

                    </div>


                    <!-- AÇÃO DO COMPROMISSO -->

                    <button 
                        type="button" 
                        class="botao-fechar" 
                        aria-label="Remover compromisso"
                    >
                        &times;
                    </button>

                </article>


            </div>

        </section>


    </main>

</body>

</html>
