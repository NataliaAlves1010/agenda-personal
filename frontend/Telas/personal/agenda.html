<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitMatch - Agenda</title>

    <!-- FULLCALENDAR -->

    <script 
        src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js" 
        defer>
    </script>

    <script 
        src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/global.js" 
        defer>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales/pt-br/global.js" defer></script>

    <!-- SCRIPT DA AGENDA -->

    <script src="../../js/agenda.js" defer></script>

    <!-- FULLCALENDAR STYLESHEETS -->

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css" 
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/theme.css" 
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/palettes/purple.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../css/personal/agenda.css">

</head>


<body>

    <!-- CABEÇALHO -->

    <header class="aba-navegacao">

        <h1 class="logo">FitMatch</h1>

        <nav class="menu" id="menu">

            <ul>

                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="criacao_treino.html">Criação de Treino</a></li>
                <li><a href="meu_perfil.html">Meu Perfil</a></li>

            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="agenda-container">


        <!-- TÍTULO DA PÁGINA E BOTÃO -->

        <div class="cabecalho-pagina">

            <h2 class="titulo-pagina">
                Agenda de Treinos
            </h2>

            <button 
                type="button" 
                class="btn-agendar-compromisso" 
                id="btn-abrir-modal"
            >
                Agendar Compromisso
            </button>

        </div>


        <!-- CALENDÁRIO -->

        <div 
            id="calendar" 
            class="calendario-box">
        </div>


        <!-- PROGRAMAÇÃO DO DIA -->

        <section class="programacao-dia">

            <div class="cabecalho-secao">

                <h3 class="titulo-secao">
                    Programação do dia
                </h3>

                <time 
                    class="data-selecionada" 
                    datetime="2026-09-16"
                >
                    16 de Setembro, 2026
                </time>

            </div>


            <!-- LISTA DE COMPROMISSOS -->

            <div class="lista-compromissos">


                <!-- COMPROMISSO -->

                <article class="card-compromisso">

                    <div class="detalhes-compromisso">

                        <time 
                            class="horario" 
                            datetime="07:00"
                        >
                            07:00
                        </time>

                        <span class="nome-aluno">
                            João Silva
                        </span>

                        <span class="tipo-treino">
                            Avaliação física
                        </span>

                    </div>


                    <!-- INFORMAÇÕES ADICIONAIS -->

                    <div class="informacoes-compromisso">

                        <span>
                            60 minutos
                        </span>

                        <span>
                            Sala de avaliação
                        </span>

                    </div>


                    <!-- AÇÃO DO COMPROMISSO -->

                    <button 
                        type="button" 
                        class="botao-fechar" 
                        aria-label="Remover compromisso"
                    >
                        &times;
                    </button>

                </article>


            </div>

        </section>


    </main>

    <!-- MODAL DE AGENDAR COMPROMISSO -->
    <div class="modal-overlay hidden" id="modal-compromisso" aria-hidden="true">
        
        <div class="modal-container" role="dialog" aria-labelledby="modal-titulo">
            
            <div class="modal-cabecalho">
                <h3 class="modal-titulo" id="modal-titulo">
                    Agendar Compromisso / Treino
                </h3>
                <button class="botao-fechar" id="btn-fechar-modal-x" type="button" aria-label="Fechar janela">&times;</button>
            </div>

            <form class="form-compromisso" id="form-compromisso">
                
                <!-- ALUNO -->
                <div class="campo-form">
                    <label for="comp-aluno" class="rotulo-campo">
                        Aluno *
                    </label>
                    <select id="comp-aluno" name="aluno" class="input-select" required>
                        <option value="1">João Silva (FM-1024)</option>
                        <option value="2">Mariana Lopes (FM-1042)</option>
                        <option value="3">Carlos Eduardo (FM-1011)</option>
                    </select>
                </div>

                <!-- DATA E HORÁRIO -->
                <div class="linha-dupla">
                    <div class="campo-form">
                        <label for="comp-data" class="rotulo-campo">
                            Data *
                        </label>
                        <input type="date" id="comp-data" name="data" class="input-data" value="2026-09-18" required>
                    </div>

                    <div class="campo-form">
                        <label for="comp-hora" class="rotulo-campo">
                            Horário *
                        </label>
                        <input type="time" id="comp-hora" name="hora" class="input-hora" value="08:00" required>
                    </div>
                </div>

                <!-- TIPO DE ATIVIDADE -->
                <div class="campo-form">
                    <label for="comp-tipo" class="rotulo-campo">
                        Tipo de Atividade
                    </label>
                    <select id="comp-tipo" name="tipo" class="input-select">
                        <option value="treino_a">Treino</option>
                        <option value="avaliacao">Avaliação Física / Bioimpedância</option>
                        <option value="consultoria">Consultoria Online</option>
                    </select>
                </div>

                <!-- AÇÕES DO MODAL -->
                <div class="modal-acoes">
                    <button type="button" class="btn-cancelar" id="btn-cancelar">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-confirmar">
                        Confirmar Agendamento
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
